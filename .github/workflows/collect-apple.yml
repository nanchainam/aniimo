name: Collect App Store reviews

on:
  schedule:
    - cron: "5 0,3,6,9,12,15,18,21 * * *"   # every 3h, :05 past — 13:05 ICT is the last before cutoff
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python collect_apple.py
        env:
          APPLE_APP_ID: ${{ vars.APPLE_APP_ID }}
          SHEET_ID: ${{ vars.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
